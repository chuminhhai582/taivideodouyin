version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /tmp/douyin_downloads:/tmp/douyin_downloads
      - /tmp/douyin_subtitles:/tmp/douyin_subtitles
      - /tmp/douyin_output:/tmp/douyin_output
    env_file:
      - .env
    environment:
      - DOWNLOAD_DIR=/tmp/douyin_downloads
      - SUBTITLE_DIR=/tmp/douyin_subtitles
      - OUTPUT_DIR=/tmp/douyin_output
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
